services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindmetric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-mindmetric}
    volumes:
      - mindmetric_prod_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mindmetric} -d ${POSTGRES_DB:-mindmetric}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mindmetric}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mindmetric}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["pnpm", "db:migrate"]

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-mindmetric}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mindmetric}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_ORIGIN: http://api:3001
      DATABASE_URL: postgres://${POSTGRES_USER:-mindmetric}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mindmetric}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env.production}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mindmetric_prod_pg:
